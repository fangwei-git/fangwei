<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>上班鼓励器</title>
<style>
:root{--ink:#15251f;--muted:#708078;--green:#1d6b56;--mint:#e6f2eb;--line:#dce7e0;--gold:#edb84c;--paper:#fbfcfa;}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7faf7,#edf5ef);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.shell{max-width:1080px;margin:auto;padding:24px 18px 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.brand{display:flex;gap:12px;align-items:center}.mark{width:42px;height:42px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:21px;font-weight:800;box-shadow:0 8px 18px #1d6b5630}.eyebrow{font-size:12px;color:var(--green);font-weight:700;letter-spacing:.08em}.brand h1{font-size:22px;margin:0}.actions{display:flex;gap:9px}.button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}.button.primary{background:var(--green);color:#fff;border-color:var(--green)}.button:hover{filter:brightness(.98);transform:translateY(-1px)}
.hero{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 18px 50px #1d6b5610}.date{color:var(--muted);font-size:14px}.status{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:14px 0 22px}.status h2{font-size:clamp(28px,5vw,48px);line-height:1.05;margin:0}.status p{margin:9px 0 0;color:var(--muted)}.badge{background:var(--mint);color:var(--green);padding:8px 12px;border-radius:99px;font-weight:800;white-space:nowrap}.progress{height:14px;background:#e9efeb;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--green),#54a27f);border-radius:99px;transition:width .5s}.progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:8px}.money{font-size:clamp(40px,9vw,78px);font-weight:850;letter-spacing:-.04em;margin:20px 0 0;color:#a55628}.money small{font-size:17px;color:var(--muted);font-weight:600;letter-spacing:0}.money-caption{color:var(--muted);margin-top:-4px}.timer-row{display:flex;align-items:center;gap:14px;margin-top:24px;flex-wrap:wrap}.timer{font-variant-numeric:tabular-nums;font-size:30px;font-weight:800}.tip{color:var(--muted)}
.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;margin-top:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.panel h3{margin:0 0 17px;font-size:17px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f6faf7;border-radius:13px;padding:15px}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}.setting-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input{width:100%;border:1px solid var(--line);padding:11px;border-radius:9px;font:inherit}.note{font-size:12px;color:var(--muted);margin-top:14px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(90px);background:#15251f;color:#fff;padding:11px 16px;border-radius:10px;transition:.25s;pointer-events:none}.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:720px){.shell{padding:16px 12px 30px}.top{align-items:flex-start}.actions .button{padding:8px 10px;font-size:12px}.hero{padding:21px}.status{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:12px}.stat b{font-size:18px}.setting-grid{grid-template-columns:1fr 1fr}}
</style></head>
<body><main class="shell">
<header class="top"><div class="brand"><div class="mark">8</div><div><div class="eyebrow">WORK ENCOURAGER</div><h1>上班鼓励器</h1></div></div><div class="actions"><button class="button" id="settingsBtn">设置</button><button class="button primary" id="shareBtn">分享给同事</button></div></header>
<section class="hero"><div class="date" id="date"></div><div class="status"><div><h2 id="headline">准备开始</h2><p id="subline">今天也认真工作，准时下班。</p></div><div class="badge" id="dayBadge">工作日</div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="progress-meta"><span id="progressText">今日进度 0%</span><span id="hoursText">0.00 / 8.00 小时</span></div><div class="money" id="money">¥0.00</div><div class="money-caption">今天已经赚到的工资</div><div class="timer-row"><div class="timer" id="timer">08:00:00</div><span class="tip" id="timerTip">点击“开始上班”开始计时</span><button class="button primary" id="startBtn">开始上班</button></div></section>
<section class="grid"><div class="panel"><h3>今天的进度</h3><div class="stats"><div class="stat"><b id="remaining">08:00:00</b><span>距离下班</span></div><div class="stat"><b id="rate">¥0.00 / 秒</b><span>当前赚取速度</span></div><div class="stat"><b id="monthMoney">¥0.00</b><span>本月累计</span></div></div><p class="note">按标准双休计算，法定节假日暂按普通工作日显示。数据保存在当前浏览器，分享链接会带上你的工资和工时设置。</p></div><div class="panel"><h3>工作设置</h3><div class="setting-grid"><div class="field"><label>月薪（元）</label><input id="salary" type="number" min="0" step="100"></div><div class="field"><label>每日工作（小时）</label><input id="workHours" type="number" min="1" max="24" step="0.5"></div><div class="field"><label>上班时间</label><input id="startTime" type="time"></div><div class="field"><label>下班时间</label><input id="endTime" type="time"></div></div><button class="button" id="saveBtn" style="margin-top:15px;width:100%">保存设置</button></div></section>
</main><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), defaults={salary:6000,workHours:8,startTime:'09:00',endTime:'18:00'};
let cfg={...defaults,...JSON.parse(localStorage.getItem('work-encourager-config')||'{}')}, running=localStorage.getItem('work-encourager-running')==='1', startedAt=Number(localStorage.getItem('work-encourager-startedAt')||0), elapsed=Number(localStorage.getItem('work-encourager-elapsed')||0), timerId;
const params=new URLSearchParams(location.search); if(params.has('salary')) cfg.salary=Number(params.get('salary'))||cfg.salary;if(params.has('hours'))cfg.workHours=Number(params.get('hours'))||cfg.workHours;if(params.has('start'))cfg.startTime=params.get('start');if(params.has('end'))cfg.endTime=params.get('end');
function isWorkday(){return new Date().getDay()!==0&&new Date().getDay()!==6} function monthWorkdays(){let d=new Date(),n=0;for(let i=1;i<=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();i++){let w=new Date(d.getFullYear(),d.getMonth(),i).getDay();if(w>0&&w<6)n++}return n||21}
function fmt(s){s=Math.max(0,Math.floor(s));return [s/3600,s%3600/60,s%60].map((v,i)=>String(Math.floor(v)).padStart(2,'0')).join(':')}
function todayBase(){let d=new Date();let [h,m]=cfg.startTime.split(':').map(Number);d.setHours(h,m,0,0);return d}
function workSeconds(){return cfg.workHours*3600} function worked(){if(!isWorkday())return 0;let now=Date.now();return running?Math.min(workSeconds(),elapsed+(now-startedAt)/1000):Math.min(workSeconds(),elapsed)}
function render(){let now=new Date(), sec=worked(), pct=Math.min(100,sec/workSeconds()*100), perSecond=cfg.salary/(monthWorkdays()*workSeconds()), money=sec*perSecond;$('#date').textContent=now.toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'long'});let work=isWorkday();$('#dayBadge').textContent=work?'工作日':'双休日';$('#headline').textContent=!work?'今天休息':pct>=100?'下班啦':running?'上班中':'准备开始';$('#subline').textContent=!work?'今天不用上班，好好休息。':pct>=100?'今天的任务完成，准时下班！':running?'每一秒都在兑换自由时间。':'点击开始，工资计时器就会启动。';$('#bar').style.width=pct+'%';$('#progressText').textContent='今日进度 '+pct.toFixed(1)+'%';$('#hoursText').textContent=(sec/3600).toFixed(2)+' / '+cfg.workHours.toFixed(2)+' 小时';$('#money').innerHTML='¥'+money.toFixed(2)+' <small>元</small>';$('#timer').textContent=fmt(workSeconds()-sec);$('#remaining').textContent=fmt(workSeconds()-sec);$('#rate').textContent='¥'+perSecond.toFixed(4)+' / 秒';$('#monthMoney').textContent='¥'+money.toFixed(2);$('#startBtn').textContent=running?'暂停计时':pct>=100?'今日完成':'开始上班';$('#timerTip').textContent=running?'计时进行中':pct>=100?'可以收工了':'点击按钮开始计时'}
function tick(){render();if(running)timerId=requestAnimationFrame(tick)} function toggle(){if(!isWorkday()){toast('今天是双休日，不需要打卡');return}if(running){elapsed+= (Date.now()-startedAt)/1000;running=false;localStorage.setItem('work-encourager-elapsed',elapsed);localStorage.setItem('work-encourager-running','0');cancelAnimationFrame(timerId)}else{startedAt=Date.now();running=true;localStorage.setItem('work-encourager-startedAt',startedAt);localStorage.setItem('work-encourager-running','1');tick()}render()}
function fill(){for(let k of ['salary','workHours','startTime','endTime'])$('#'+k).value=cfg[k]}function save(){cfg.salary=Number($('#salary').value)||6000;cfg.workHours=Number($('#workHours').value)||8;cfg.startTime=$('#startTime').value||'09:00';cfg.endTime=$('#endTime').value||'18:00';localStorage.setItem('work-encourager-config',JSON.stringify(cfg));toast('设置已保存');render()}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
$('#startBtn').onclick=toggle;$('#saveBtn').onclick=save;$('#settingsBtn').onclick=()=>$('#salary').focus();$('#shareBtn').onclick=async()=>{let url=location.origin+location.pathname+'?salary='+encodeURIComponent(cfg.salary)+'&hours='+encodeURIComponent(cfg.workHours)+'&start='+cfg.startTime+'&end='+cfg.endTime;try{await navigator.clipboard.writeText(url);toast('分享链接已复制')}catch{prompt('复制这个分享链接',url)}};fill();render();if(running)tick();
</script></body></html>
